<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <style>
    .l0{fill:#1e3a8a;stroke:#1e3a8a}
    .l1{fill:#dbeafe;stroke:#3b82f6;stroke-width:2}
    .l2{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}
    .t0{fill:#fff;font-size:15px;font-weight:700;text-anchor:middle}
    .t1{fill:#1e3a8a;font-size:14px;font-weight:600;text-anchor:middle}
    .t2{fill:#334155;font-size:12px;text-anchor:middle}
    .edge{stroke:#94a3b8;stroke-width:1.5;fill:none}
    .cap{fill:#64748b;font-size:11px;text-anchor:start}
  </style>

  <!-- Level 0 -->
  <rect class="l0" x="320" y="16" width="140" height="46" rx="10"/>
  <text class="t0" x="390" y="44">프로젝트 (100%)</text>

  <!-- Level 1 deliverables -->
  <rect class="l1" x="40"  y="120" width="180" height="44" rx="9"/>
  <text class="t1" x="130" y="147">인도물 A</text>
  <rect class="l1" x="300" y="120" width="180" height="44" rx="9"/>
  <text class="t1" x="390" y="147">인도물 B</text>
  <rect class="l1" x="560" y="120" width="180" height="44" rx="9"/>
  <text class="t1" x="650" y="147">인도물 C</text>

  <!-- Level 2 work packages -->
  <rect class="l2" x="40"  y="212" width="86" height="40" rx="8"/><text class="t2" x="83"  y="237">WP 1.1</text>
  <rect class="l2" x="134" y="212" width="86" height="40" rx="8"/><text class="t2" x="177" y="237">WP 1.2</text>
  <rect class="l2" x="300" y="212" width="86" height="40" rx="8"/><text class="t2" x="343" y="237">WP 2.1</text>
  <rect class="l2" x="394" y="212" width="86" height="40" rx="8"/><text class="t2" x="437" y="237">WP 2.2</text>
  <rect class="l2" x="560" y="212" width="86" height="40" rx="8"/><text class="t2" x="603" y="237">WP 3.1</text>
  <rect class="l2" x="654" y="212" width="86" height="40" rx="8"/><text class="t2" x="697" y="237">WP 3.2</text>

  <!-- edges L0 -> L1 -->
  <path class="edge" d="M390,62 V92 H130 V120"/>
  <path class="edge" d="M390,62 V92 H390 V120"/>
  <path class="edge" d="M390,62 V92 H650 V120"/>
  <!-- edges L1 -> L2 -->
  <path class="edge" d="M130,164 V188 H83  V212"/>
  <path class="edge" d="M130,164 V188 H177 V212"/>
  <path class="edge" d="M390,164 V188 H343 V212"/>
  <path class="edge" d="M390,164 V188 H437 V212"/>
  <path class="edge" d="M650,164 V188 H603 V212"/>
  <path class="edge" d="M650,164 V188 H697 V212"/>

  <text class="cap" x="20" y="292">· 인도물 중심 분해 · 최하위 = 작업패키지(관리 가능 최소 단위) · 100% 규칙 · 8/80 시간 기준</text>
</svg>
