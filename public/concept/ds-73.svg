<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>
  <style>
    .node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
    .c{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}.st{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}.nw{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5}
    .mgmt{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
    .t{fill:#1e3a8a;font-size:13px;font-weight:600;text-anchor:middle}.s{fill:#475569;font-size:11px;text-anchor:middle}.cap{fill:#64748b;font-size:11px;text-anchor:middle}
  </style>
  <rect class="mgmt" x="250" y="20" width="280" height="46" rx="10"/>
  <text class="t" x="390" y="42">통합 관리 · 소프트웨어 정의(SDS·가상화)</text><text class="s" x="390" y="59">단일 콘솔에서 컴퓨트·스토리지·네트워크 관리</text>

  <!-- 3 x86 nodes -->
  <g>
    <rect class="node" x="40"  y="110" width="200" height="150" rx="12"/>
    <rect class="node" x="290" y="110" width="200" height="150" rx="12"/>
    <rect class="node" x="540" y="110" width="200" height="150" rx="12"/>
  </g>
  <text class="s" x="140" y="128">x86 표준 서버 노드 1</text>
  <text class="s" x="390" y="128">노드 2</text>
  <text class="s" x="640" y="128">노드 3 … (Scale-Out)</text>

  <!-- per node: compute/storage/network -->
  <g font-size="11">
    <rect class="c"  x="55"  y="138" width="170" height="32" rx="6"/><text class="t" x="140" y="159" font-size="11">컴퓨트 (VM/컨테이너)</text>
    <rect class="st" x="55"  y="176" width="170" height="32" rx="6"/><text class="t" x="140" y="197" font-size="11" fill="#065f46">스토리지 (SDS)</text>
    <rect class="nw" x="55"  y="214" width="170" height="32" rx="6"/><text class="t" x="140" y="235" font-size="11" fill="#92400e">네트워크 (SDN)</text>

    <rect class="c"  x="305" y="138" width="170" height="32" rx="6"/><text class="t" x="390" y="159" font-size="11">컴퓨트</text>
    <rect class="st" x="305" y="176" width="170" height="32" rx="6"/><text class="t" x="390" y="197" font-size="11" fill="#065f46">스토리지</text>
    <rect class="nw" x="305" y="214" width="170" height="32" rx="6"/><text class="t" x="390" y="235" font-size="11" fill="#92400e">네트워크</text>

    <rect class="c"  x="555" y="138" width="170" height="32" rx="6"/><text class="t" x="640" y="159" font-size="11">컴퓨트</text>
    <rect class="st" x="555" y="176" width="170" height="32" rx="6"/><text class="t" x="640" y="197" font-size="11" fill="#065f46">스토리지</text>
    <rect class="nw" x="555" y="214" width="170" height="32" rx="6"/><text class="t" x="640" y="235" font-size="11" fill="#92400e">네트워크</text>
  </g>

  <line stroke="#94a3b8" stroke-width="2" x1="240" y1="185" x2="290" y2="185" marker-end="url(#a)"/>
  <line stroke="#94a3b8" stroke-width="2" x1="490" y1="185" x2="540" y2="185" marker-end="url(#a)"/>
  <text class="cap" x="390" y="300">노드 추가만으로 선형 확장(Scale-Out) · 자원 풀링 · SDI 기반 통합 인프라</text>
</svg>
